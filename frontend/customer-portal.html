<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Müşteri Portalı - Oto Tamirci Sistemi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .customer-info {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-card label {
            color: #666;
            font-size: 0.9em;
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }

        .info-card p {
            color: #333;
            font-size: 1.1em;
            font-weight: 500;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .vehicle-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #764ba2;
        }

        .vehicle-card h3 {
            color: #764ba2;
            margin-bottom: 10px;
        }

        .vehicle-card p {
            color: #666;
            margin: 5px 0;
            font-size: 0.95em;
        }

        .service-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .service-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .service-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .service-info span {
            background: white;
            padding: 8px;
            border-radius: 5px;
            color: #666;
            font-size: 0.9em;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 10px;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-in-progress {
            background: #d1ecf1;
            color: #0c5460;
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .photo-item {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .photo-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .payment-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .payment-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .payment-item {
            background: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }

        .payment-item label {
            color: #666;
            font-size: 0.9em;
            display: block;
            margin-bottom: 5px;
        }

        .payment-item strong {
            color: #667eea;
            font-size: 1.2em;
            display: block;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #764ba2;
            color: white;
        }

        .btn-secondary:hover {
            background: #653a8a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .report-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .report-btn:hover {
            background: #5568d3;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .photo-gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Başlık -->
        <div class="header">
            <h1>🔧 Oto Tamirci Müşteri Portalı</h1>
            <p>Servis ve araç bilgilerinizi takip edin</p>
        </div>

        <!-- Müşteri Bilgileri -->
        <div id="customer-container" class="customer-info">
            <div class="loading">⏳ Yükleniyor...</div>
        </div>

        <!-- Araçlar Bölümü -->
        <div id="vehicles-section" class="section" style="display: none;">
            <h2>🚗 Araçlarınız</h2>
            <div id="vehicles-list"></div>
        </div>

        <!-- Servisler Bölümü -->
        <div id="services-section" class="section" style="display: none;">
            <h2>🛠️ Servis Geçmişi</h2>
            <div id="services-list"></div>
        </div>

        <!-- Ödemeler Bölümü -->
        <div id="payments-section" class="section" style="display: none;">
            <h2>💳 Ödemeler</h2>
            <div id="payments-list"></div>
        </div>
    </div>

    <script>
        // URL'den müşteri kodunu al
        const params = new URLSearchParams(window.location.search);
        const customerId = params.get('id') || localStorage.getItem('customerId');

        const API_BASE = 'http://localhost:3000/api';

        // Müşteri bilgilerini yükle
        async function loadCustomerData() {
            try {
                if (!customerId) {
                    document.getElementById('customer-container').innerHTML = 
                        '<div class="error">❌ Müşteri kimliği bulunamadı</div>';
                    return;
                }

                const response = await fetch(`${API_BASE}/customers/${customerId}`);
                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message);
                }

                const { customer, vehicles, services } = result.data;

                // Müşteri bilgilerini göster
                displayCustomerInfo(customer);

                // Araçları göster
                if (vehicles.length > 0) {
                    displayVehicles(vehicles);
                }

                // Servisleri göster
                if (services.length > 0) {
                    displayServices(services);
                }

                // Ödemeleri yükle
                loadPayments(customerId);

                localStorage.setItem('customerId', customerId);
            } catch (error) {
                console.error('Veri yükleme hatası:', error);
                document.getElementById('customer-container').innerHTML = 
                    `<div class="error">❌ Hata: ${error.message}</div>`;
            }
        }

        function displayCustomerInfo(customer) {
            const html = `
                <h2>👤 Hoş Geldiniz, ${customer.name}!</h2>
                <div class="info-grid">
                    <div class="info-card">
                        <label>📞 Telefon</label>
                        <p>${customer.phone}</p>
                    </div>
                    <div class="info-card">
                        <label>📧 Email</label>
                        <p>${customer.email || 'Belirtilmemiş'}</p>
                    </div>
                    <div class="info-card">
                        <label>📍 Adres</label>
                        <p>${customer.address || 'Belirtilmemiş'}</p>
                    </div>
                    <div class="info-card">
                        <label>📅 Kayıt Tarihi</label>
                        <p>${new Date(customer.registration_date).toLocaleDateString('tr-TR')}</p>
                    </div>
                </div>
            `;
            document.getElementById('customer-container').innerHTML = html;
        }

        function displayVehicles(vehicles) {
            const vehiclesSection = document.getElementById('vehicles-section');
            vehiclesSection.style.display = 'block';

            const html = vehicles.map(v => `
                <div class="vehicle-card">
                    <h3>🚙 ${v.brand} ${v.model}</h3>
                    <p><strong>Plaka:</strong> ${v.license_plate}</p>
                    <p><strong>Yıl:</strong> ${v.year || 'Belirtilmemiş'}</p>
                    <p><strong>Renk:</strong> ${v.color || 'Belirtilmemiş'}</p>
                    <p><strong>Yakıt Türü:</strong> ${v.fuel_type || 'Belirtilmemiş'}</p>
                    <p><strong>Kilometre:</strong> ${v.mileage || 0} km</p>
                </div>
            `).join('');

            document.getElementById('vehicles-list').innerHTML = html || 
                '<div class="empty-state">Henüz araç kaydı yok</div>';
        }

        function displayServices(services) {
            const servicesSection = document.getElementById('services-section');
            servicesSection.style.display = 'block';

            const html = services.map(s => {
                const statusClass = s.status === 'Tamamlandı' ? 'status-completed' : 
                                   s.status === 'Devam Ediyor' ? 'status-in-progress' : 'status-pending';
                
                return `
                    <div class="service-card">
                        <h3>${s.brand} ${s.model} - ${s.service_description || 'Servis'}</h3>
                        <span class="status-badge ${statusClass}">${s.status}</span>
                        <div class="service-info">
                            <span>📅 ${new Date(s.start_date).toLocaleDateString('tr-TR')}</span>
                            <span>💰 ₺${s.cost || 0}</span>
                        </div>
                        ${s.notes ? `<p style="margin-top: 10px; color: #666;"><strong>Notlar:</strong> ${s.notes}</p>` : ''}
                        <a href="#" onclick="downloadReport(${s.id}); return false;" class="report-btn">
                            📄 Rapor İndir
                        </a>
                    </div>
                `;
            }).join('');

            document.getElementById('services-list').innerHTML = html || 
                '<div class="empty-state">Henüz servis kaydı yok</div>';
        }

        async function loadPayments(customerId) {
            try {
                const response = await fetch(`${API_BASE}/payments/customer/${customerId}`);
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    const paymentsSection = document.getElementById('payments-section');
                    paymentsSection.style.display = 'block';

                    const totalPaid = result.data
                        .filter(p => p.status === 'Ödendi')
                        .reduce((sum, p) => sum + parseFloat(p.amount), 0);

                    const totalPending = result.data
                        .filter(p => p.status === 'Beklemede')
                        .reduce((sum, p) => sum + parseFloat(p.amount), 0);

                    const html = `
                        <div class="payment-section">
                            <div class="payment-info">
                                <div class="payment-item">
                                    <label>✅ Ödenen Tutar</label>
                                    <strong>₺${totalPaid.toFixed(2)}</strong>
                                </div>
                                <div class="payment-item">
                                    <label>⏳ Beklemede</label>
                                    <strong>₺${totalPending.toFixed(2)}</strong>
                                </div>
                                <div class="payment-item">
                                    <label>📊 Toplam</label>
                                    <strong>₺${(totalPaid + totalPending).toFixed(2)}</strong>
                                </div>
                            </div>
                        </div>
                    `;

                    document.getElementById('payments-list').innerHTML = html;
                }
            } catch (error) {
                console.error('Ödemeler yükleme hatası:', error);
            }
        }

        async function downloadReport(serviceId) {
            try {
                const response = await fetch(`${API_BASE}/reports/${serviceId}/pdf`);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `rapor-${serviceId}.pdf`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (error) {
                alert('❌ Rapor indirilemedi: ' + error.message);
            }
        }

        // Sayfayı yükle
        loadCustomerData();
    </script>
</body>
</html>
